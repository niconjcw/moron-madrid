
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto — Morón Madrid</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* CARRUSEL DE PRODUCTO */

    .product-gallery {
      position: relative;
      display: block;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      background: #fff;
      align-self: start;
    }

    .carousel-viewport {
      width: 100%;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      gap: 1px;
      width: 100%;
      background: #fff;
      transition: transform 0.45s ease;
    }

    .carousel-slide {
      flex: 0 0 100%;
      width: 100%;
      min-width: 0;
      aspect-ratio: 4 / 5;
      background: #f5f5f5;
    }

    .carousel-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f5f5f5;
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 42px;
      height: 42px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(245, 245, 245, 0.85);
      color: #000;
      font-family: Arial, sans-serif;
      font-size: 25px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
    }

    .carousel-arrow:hover {
      opacity: 0.6;
    }

    .carousel-prev {
      left: 15px;
    }

    .carousel-next {
      right: 15px;
    }

    .carousel-arrow:disabled {
      opacity: 0;
      pointer-events: none;
    }

    .carousel-counter {
      position: absolute;
      bottom: 15px;
      right: 18px;
      z-index: 5;
      font-size: 0.75rem;
      color: #000;
      background: rgba(245, 245, 245, 0.8);
      padding: 5px 8px;
    }

    .product-details {
      min-width: 0;
      align-self: start;
    }

    @media (max-width: 700px) {
      .product-gallery {
        width: 100%;
      }

      .carousel-slide {
        aspect-ratio: 4 / 5;
      }

      .carousel-arrow {
        width: 36px;
        height: 36px;
        font-size: 22px;
      }

      .carousel-prev {
        left: 10px;
      }

      .carousel-next {
        right: 10px;
      }

      .product-details {
        align-self: stretch;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="../" class="logo">
      <img src="../sticker.png" alt="morón madrid">
    </a>

    <nav>
      <span class="tienda-link">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEguX14GzmThK94GeMibceKA7zICqad06YxNNfXdMDJWfekWmO24pdYg9z9BdkouOws5N-Haa-0IfN-U79hTyy7-EB1WS40G4UsRYDb8xFVnx9iB5SYvx0J5BH5a5E35dx3srcSqWHckxVBJ/s1600/nuevo-2.gif" alt="">
        <a href="./">tienda</a>
      </span>
      <a href="../#estudio">archivo</a>
      <a href="../#nosotros">nosotros</a>
      <a href="../#contacto">contacto</a>
    </nav>
  </header>

  <main class="product-page" id="product-page">
    <p id="loading-message">cargando producto...</p>
  </main>

  <script>
    const API_URL = "https://moron-madrid-api.moronmadrid.workers.dev";

    const page = document.getElementById("product-page");
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    function formatPrice(price) {
      return "$ " + Number(price).toLocaleString("es-AR");
    }

    function createCarousel(images, productName) {
      const gallery = document.createElement("section");
      gallery.className = "product-gallery";

      if (images.length === 0) {
        const empty = document.createElement("p");
        empty.textContent = "imágenes próximamente";
        gallery.appendChild(empty);
        return gallery;
      }

      const viewport = document.createElement("div");
      viewport.className = "carousel-viewport";

      const track = document.createElement("div");
      track.className = "carousel-track";

      images.forEach((url, index) => {
        const slide = document.createElement("div");
        slide.className = "carousel-slide";

        const img = document.createElement("img");
        img.src = url;
        img.alt = productName + " — vista " + (index + 1);
        img.loading = index === 0 ? "eager" : "lazy";

        img.onerror = () => {
          slide.remove();
          updateCarousel();
        };

        slide.appendChild(img);
        track.appendChild(slide);
      });

      viewport.appendChild(track);
      gallery.appendChild(viewport);

      let currentIndex = 0;

      const prevButton = document.createElement("button");
      prevButton.className = "carousel-arrow carousel-prev";
      prevButton.type = "button";
      prevButton.textContent = "‹";
      prevButton.setAttribute("aria-label", "Imagen anterior");

      const nextButton = document.createElement("button");
      nextButton.className = "carousel-arrow carousel-next";
      nextButton.type = "button";
      nextButton.textContent = "›";
      nextButton.setAttribute("aria-label", "Imagen siguiente");

      const counter = document.createElement("div");
      counter.className = "carousel-counter";

      function updateCarousel() {
        const slides = track.querySelectorAll(".carousel-slide");
        const total = slides.length;

        if (total === 0) {
          counter.textContent = "";
          prevButton.style.display = "none";
          nextButton.style.display = "none";
          return;
        }

        if (currentIndex >= total) {
          currentIndex = total - 1;
        }

        track.style.transform =
          `translateX(calc(${currentIndex} * -100% - ${currentIndex}px))`;

        counter.textContent = (currentIndex + 1) + " / " + total;

        prevButton.disabled = currentIndex === 0;
        nextButton.disabled = currentIndex === total - 1;

        const showControls = total > 1;
        prevButton.style.display = showControls ? "flex" : "none";
        nextButton.style.display = showControls ? "flex" : "none";
        counter.style.display = showControls ? "block" : "none";
      }

      prevButton.addEventListener("click", () => {
        if (currentIndex > 0) {
          currentIndex--;
          updateCarousel();
        }
      });

      nextButton.addEventListener("click", () => {
        const total = track.querySelectorAll(".carousel-slide").length;

        if (currentIndex < total - 1) {
          currentIndex++;
          updateCarousel();
        }
      });

      gallery.append(prevButton, nextButton, counter);

      updateCarousel();

      return gallery;
    }

    function renderProduct(product) {
      document.title = product.name + " — Morón Madrid";

      page.innerHTML = "";

      // REUNIR TODAS LAS IMÁGENES
      const images = [];

      if (product.image) images.push(product.image);
      if (product.image_hover) images.push(product.image_hover);

      if (Array.isArray(product.gallery)) {
        [...product.gallery]
          .sort((a, b) => a.sort_order - b.sort_order)
          .forEach(item => {
            if (item.image_url) images.push(item.image_url);
          });
      }

      const uniqueImages = [...new Set(images)];

      // CARRUSEL
      const gallery = createCarousel(uniqueImages, product.name);

      // INFORMACIÓN
      const details = document.createElement("section");
      details.className = "product-details";

      const heading = document.createElement("div");

      const category = document.createElement("p");
      category.className = "product-category";
      category.textContent = "morón madrid / colección";

      const title = document.createElement("h1");
      title.textContent = product.name;

      const price = document.createElement("p");
      price.className = "product-price";
      price.textContent = formatPrice(product.price);

      heading.append(category, title, price);

      // DESCRIPCIÓN
      const description = document.createElement("div");
      description.className = "product-description";

      const descriptionText = document.createElement("p");
      descriptionText.textContent = product.description || "";
      description.appendChild(descriptionText);

      // OPCIONES Y STOCK
      const options = document.createElement("div");
      options.className = "product-options";

      const variants = Array.isArray(product.variants)
        ? product.variants
        : [];

      const isSingleProduct =
        variants.length === 1 &&
        String(variants[0].size || "").toLowerCase() === "único";

      let sizeSelect = null;
      let selectedVariant = null;

      if (isSingleProduct) {
        selectedVariant = variants[0];

        if (Number(selectedVariant.stock) <= 0) {
          const stockMessage = document.createElement("p");
          stockMessage.className = "product-stock";
          stockMessage.textContent = "sin stock";
          options.appendChild(stockMessage);
        }

      } else if (variants.length > 0) {
        const label = document.createElement("label");
        label.htmlFor = "size";
        label.textContent = "talle";

        sizeSelect = document.createElement("select");
        sizeSelect.id = "size";

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "seleccionar talle";
        sizeSelect.appendChild(placeholder);

        variants.forEach(variant => {
          const option = document.createElement("option");

          option.value = variant.id || variant.size || "";
          option.textContent = variant.size || "opción";

          if (Number(variant.stock) <= 0) {
            option.disabled = true;
            option.textContent += " — sin stock";
          }

          sizeSelect.appendChild(option);
        });

        sizeSelect.addEventListener("change", () => {
          selectedVariant = variants.find(variant =>
            String(variant.id || variant.size || "") === sizeSelect.value
          ) || null;

          buyButton.disabled =
            !selectedVariant || Number(selectedVariant.stock) <= 0;
        });

        options.append(label, sizeSelect);
      }

      // BOTÓN DE COMPRA
      const buyButton = document.createElement("button");
      buyButton.type = "button";
      buyButton.textContent = "comprar";

      const hasStock = isSingleProduct
        ? Number(selectedVariant.stock) > 0
        : variants.length === 0 || variants.some(v => Number(v.stock) > 0);

      buyButton.disabled = !hasStock;

      if (!hasStock) {
        buyButton.textContent = "sin stock";
      }

      buyButton.addEventListener("click", () => {
        if (sizeSelect && !sizeSelect.value) {
          alert("Seleccioná un talle antes de continuar.");
          return;
        }

        if (isSingleProduct && Number(selectedVariant.stock) <= 0) {
          return;
        }

        alert("¡Próximamente vas a poder comprar directamente desde acá!");
      });

      options.appendChild(buyButton);

      // VOLVER
      const back = document.createElement("a");
      back.href = "./";
      back.className = "back-link";
      back.textContent = "← volver a la tienda";

      details.append(heading, description, options, back);
      page.append(gallery, details);
    }

    async function loadProduct() {
      if (!slug) {
        page.textContent = "no se indicó ningún producto.";
        return;
      }

      try {
        const response = await fetch(`${API_URL}/products`);

        if (!response.ok) {
          throw new Error("No se pudieron cargar los productos");
        }

        const data = await response.json();
        const products = data.products || [];

        const product = products.find(item => item.slug === slug);

        if (!product) {
          page.textContent = "no encontramos este producto.";
          return;
        }

        renderProduct(product);

      } catch (error) {
        console.error(error);
        page.textContent = "no pudimos cargar el producto. intentá nuevamente.";
      }
    }

    loadProduct();
  </script>

</body>
</html>
