
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto — Morón Madrid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="announcement-bar">
    3 cuotas sin interés / -5% por transferencia / envíos a todo el país
  </div>

  <!-- HEADER -->
  <header class="site-header">

    <div class="header-left">
      <a href="./">inicio</a>

      <button type="button" class="nav-button"
        id="products-toggle" aria-expanded="false">
        productos
      </button>
    </div>

    <a href="./" class="logo" aria-label="Morón Madrid — Inicio">
      <img src="../sticker.png" alt="morón madrid">
    </a>

    <div class="header-right">
      <button type="button" class="nav-button"
        id="info-toggle" aria-expanded="false">
        información
      </button>

      <a href="https://moronmadrid.com.ar/#contacto">contacto</a>

      <button type="button" class="nav-button cart-button"
        id="cart-toggle" aria-label="Carrito">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21 8H6"/>
          <circle cx="10" cy="20" r="1"/>
          <circle cx="18" cy="20" r="1"/>
        </svg>
      </button>
    </div>

    <div class="header-dropdown products-dropdown"
      id="products-dropdown" hidden>
      <a href="./">ver todo</a>
      <div id="dynamic-categories"></div>
    </div>

    <div class="header-dropdown info-dropdown"
      id="info-dropdown" hidden>
      <a href="https://moronmadrid.com.ar/nosotros">nosotros</a>
      <a href="https://moronmadrid.com.ar/comprasenvios">compras / envíos</a>
      <a href="https://moronmadrid.com.ar/devoluciones">devoluciones</a>
    </div>

    <div class="cart-dropdown" id="cart-dropdown" hidden>
      <p>el carrito estará disponible próximamente.</p>
    </div>

    <button type="button" class="mobile-menu-button"
      id="mobile-menu-toggle" aria-expanded="false">
      menú
    </button>

    <div class="mobile-header-actions">
      <button type="button" class="nav-button cart-button"
        id="mobile-cart-toggle" aria-label="Carrito">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21 8H6"/>
          <circle cx="10" cy="20" r="1"/>
          <circle cx="18" cy="20" r="1"/>
        </svg>
      </button>
    </div>

  </header>

  <!-- MENÚ LATERAL MOBILE -->
  <nav class="mobile-panel" id="mobile-panel" hidden>
    <a href="./">inicio</a>

    <button type="button" class="mobile-section-title"
      id="mobile-products-toggle">productos</button>

    <div id="mobile-categories"></div>

    <div class="mobile-divider"></div>

    <button type="button" class="mobile-section-title"
      id="mobile-info-toggle">información</button>

    <div id="mobile-info-links">
      <a class="mobile-subitem"
        href="https://moronmadrid.com.ar/nosotros">nosotros</a>
      <a class="mobile-subitem"
        href="https://moronmadrid.com.ar/comprasenvios">compras / envíos</a>
      <a class="mobile-subitem"
        href="https://moronmadrid.com.ar/devoluciones">devoluciones</a>
    </div>

    <div class="mobile-divider"></div>
    <a href="https://moronmadrid.com.ar/#contacto">contacto</a>
  </nav>

  <main class="product-page" id="product-page">
    <p id="loading-message">cargando producto...</p>
  </main>

  <script>
    const API_URL = "https://moron-madrid-api.moronmadrid.workers.dev";

    const page = document.getElementById("product-page");
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    const productsDropdown = document.getElementById("products-dropdown");
    const infoDropdown = document.getElementById("info-dropdown");
    const mobilePanel = document.getElementById("mobile-panel");

    function formatPrice(price) {
      return "$ " + Number(price).toLocaleString("es-AR");
    }

    /* MENÚS */

    function closeMenus() {
      productsDropdown.hidden = true;
      infoDropdown.hidden = true;
      document.getElementById("cart-dropdown").hidden = true;

      document.getElementById("products-toggle")
        .setAttribute("aria-expanded", "false");

      document.getElementById("info-toggle")
        .setAttribute("aria-expanded", "false");
    }

    function toggleMenu(menu, button) {
      const wasOpen = !menu.hidden;
      closeMenus();

      if (!wasOpen) {
        menu.hidden = false;
        button.setAttribute("aria-expanded", "true");
      }
    }

    document.getElementById("products-toggle").addEventListener(
      "click",
      () => toggleMenu(
        productsDropdown,
        document.getElementById("products-toggle")
      )
    );

    document.getElementById("info-toggle").addEventListener(
      "click",
      () => toggleMenu(
        infoDropdown,
        document.getElementById("info-toggle")
      )
    );

    function toggleCart() {
      const cart = document.getElementById("cart-dropdown");
      const wasOpen = !cart.hidden;
      closeMenus();
      cart.hidden = wasOpen;
    }

    document.getElementById("cart-toggle")
      .addEventListener("click", toggleCart);

    document.getElementById("mobile-cart-toggle")
      .addEventListener("click", toggleCart);

    document.getElementById("mobile-menu-toggle")
      .addEventListener("click", () => {
        const button = document.getElementById("mobile-menu-toggle");
        const opening = mobilePanel.hidden;

        closeMenus();
        mobilePanel.hidden = !opening;
        button.setAttribute("aria-expanded", String(opening));
      });

    document.getElementById("mobile-products-toggle")
      .addEventListener("click", () => {
        const categories = document.getElementById("mobile-categories");
        categories.hidden = !categories.hidden;
      });

    document.getElementById("mobile-info-toggle")
      .addEventListener("click", () => {
        const links = document.getElementById("mobile-info-links");
        links.hidden = !links.hidden;
      });

    document.addEventListener("click", event => {
      if (
        !event.target.closest(".site-header") &&
        !event.target.closest(".mobile-panel")
      ) {
        closeMenus();
        mobilePanel.hidden = true;

        document.getElementById("mobile-menu-toggle")
          .setAttribute("aria-expanded", "false");
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeMenus();
        mobilePanel.hidden = true;

        document.getElementById("mobile-menu-toggle")
          .setAttribute("aria-expanded", "false");
      }
    });

    /* CATEGORÍAS */

    async function loadCategories() {
      try {
        const response = await fetch(`${API_URL}/categories`);
        if (!response.ok) return;

        const data = await response.json();
        const categories = Array.isArray(data.categories)
          ? data.categories
          : [];

        const desktop = document.getElementById("dynamic-categories");
        const mobile = document.getElementById("mobile-categories");

        desktop.replaceChildren();
        mobile.replaceChildren();

        categories.forEach(category => {
          const link = document.createElement("a");
          link.href = `./?categoria=${encodeURIComponent(category.id)}`;
          link.textContent = category.name.toLowerCase();
          desktop.appendChild(link);

          const mobileLink = document.createElement("a");
          mobileLink.className = "mobile-subitem";
          mobileLink.href = link.href;
          mobileLink.textContent = category.name.toLowerCase();
          mobile.appendChild(mobileLink);
        });

      } catch (error) {
        console.error("Error al cargar categorías:", error);
      }
    }

    /* PRODUCTO */

    function renderProduct(product) {
      document.title = product.name + " — Morón Madrid";
      page.replaceChildren();

      /* GALERÍA */

      const gallery = document.createElement("section");
      gallery.className = "product-gallery";

      const images = [];

      if (product.image) images.push(product.image);
      if (product.image_hover) images.push(product.image_hover);

      if (Array.isArray(product.gallery)) {
        product.gallery
          .sort((a, b) => a.sort_order - b.sort_order)
          .forEach(item => {
            if (item.image_url) images.push(item.image_url);
          });
      }

      const uniqueImages = [...new Set(images)];

      if (uniqueImages.length === 0) {
        const empty = document.createElement("p");
        empty.textContent = "imágenes próximamente";
        gallery.appendChild(empty);

      } else {
        const track = document.createElement("div");
        track.className = "carousel-track";

        let currentIndex = 0;

        uniqueImages.forEach((url, index) => {
          const slide = document.createElement("div");
          slide.className = "carousel-slide";

          const img = document.createElement("img");
          img.src = url;
          img.alt = product.name + " — vista " + (index + 1);
          img.loading = index < 2 ? "eager" : "lazy";

          img.onerror = () => {
            slide.remove();
            updateCarousel();
          };

          slide.appendChild(img);
          track.appendChild(slide);
        });

        gallery.appendChild(track);

        const controls = document.createElement("div");
        controls.className = "carousel-controls";

        const counter = document.createElement("span");
        counter.className = "carousel-counter";

        const prevButton = document.createElement("button");
        prevButton.type = "button";
        prevButton.className = "carousel-arrow";
        prevButton.textContent = "‹";
        prevButton.setAttribute("aria-label", "Imágenes anteriores");

        const nextButton = document.createElement("button");
        nextButton.type = "button";
        nextButton.className = "carousel-arrow";
        nextButton.textContent = "›";
        nextButton.setAttribute("aria-label", "Imágenes siguientes");

        controls.append(prevButton, counter, nextButton);
        gallery.appendChild(controls);

        function getSlidesPerView() {
          return window.matchMedia("(max-width: 600px)").matches ? 1 : 2;
        }

        function updateCarousel() {
          const slides = Array.from(
            track.querySelectorAll(".carousel-slide")
          );

          const total = slides.length;
          const slidesPerView = getSlidesPerView();
          const galleryWidth = gallery.clientWidth;

          const slideWidth = Math.max(
            0,
            (galleryWidth - (slidesPerView - 1)) / slidesPerView
          );

          slides.forEach(slide => {
            slide.style.width = `${slideWidth}px`;
            slide.style.flexBasis = `${slideWidth}px`;
          });

          const maxIndex = Math.max(0, total - slidesPerView);
          currentIndex = Math.min(currentIndex, maxIndex);

          track.style.transform =
            `translateX(-${currentIndex * (slideWidth + 1)}px)`;

          counter.textContent =
            `${total ? currentIndex + 1 : 0}–${Math.min(
              currentIndex + slidesPerView,
              total
            )} / ${total}`;

          controls.style.display =
            total > slidesPerView ? "flex" : "none";
        }

        prevButton.addEventListener("click", () => {
          const total = track.querySelectorAll(".carousel-slide").length;
          const maxIndex = Math.max(0, total - getSlidesPerView());

          currentIndex = currentIndex <= 0
            ? maxIndex
            : currentIndex - 1;

          updateCarousel();
        });

        nextButton.addEventListener("click", () => {
          const total = track.querySelectorAll(".carousel-slide").length;
          const maxIndex = Math.max(0, total - getSlidesPerView());

          currentIndex = currentIndex >= maxIndex
            ? 0
            : currentIndex + 1;

          updateCarousel();
        });

        window.addEventListener("resize", updateCarousel);

        track.querySelectorAll("img").forEach(img => {
          img.addEventListener("load", updateCarousel);
        });

        updateCarousel();
      }

      /* INFORMACIÓN */

      const details = document.createElement("section");
      details.className = "product-details";

      const heading = document.createElement("div");

      const category = document.createElement("p");
      category.className = "product-category";
      category.textContent = "morón madrid / colección";

      const title = document.createElement("h1");
      title.textContent = product.name;

      const price = document.createElement("p");
      price.className = "product-price";
      price.textContent = formatPrice(product.price);

      heading.append(category, title, price);

      /* DESCRIPCIÓN */

      const description = document.createElement("div");
      description.className = "product-description";

      const descriptionText = document.createElement("p");
      descriptionText.textContent = product.description || "";
      description.appendChild(descriptionText);

      /* TALLES Y STOCK */

      const options = document.createElement("div");
      options.className = "product-options";

      const variants = Array.isArray(product.variants)
        ? product.variants
        : [];

      const isSingleProduct =
        variants.length === 1 &&
        String(variants[0].size || "").toLowerCase() === "único";

      let sizeSelect = null;
      let selectedVariant = null;
      let buyButton = null;

      if (isSingleProduct) {
        selectedVariant = variants[0];

        if (Number(selectedVariant.stock) <= 0) {
          const stockMessage = document.createElement("p");
          stockMessage.className = "product-stock";
          stockMessage.textContent = "sin stock";
          options.appendChild(stockMessage);
        }

      } else if (variants.length > 0) {
        const label = document.createElement("label");
        label.htmlFor = "size";
        label.textContent = "talle";

        sizeSelect = document.createElement("select");
        sizeSelect.id = "size";

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "seleccionar talle";
        sizeSelect.appendChild(placeholder);

        variants.forEach(variant => {
          const option = document.createElement("option");

          option.value = variant.id || variant.size || "";
          option.textContent = variant.size || "opción";

          if (Number(variant.stock) <= 0) {
            option.disabled = true;
            option.textContent += " — sin stock";
          }

          sizeSelect.appendChild(option);
        });

        options.append(label, sizeSelect);
      }

      /* BOTÓN COMPRAR */

      buyButton = document.createElement("button");
      buyButton.type = "button";
      buyButton.textContent = "comprar";

      const hasStock = isSingleProduct
        ? Number(selectedVariant.stock) > 0
        : variants.length === 0 || variants.some(v => Number(v.stock) > 0);

      buyButton.disabled = !hasStock;

      if (!hasStock) {
        buyButton.textContent = "sin stock";
      }

      if (sizeSelect) {
        sizeSelect.addEventListener("change", () => {
          selectedVariant = variants.find(variant =>
            String(variant.id || variant.size || "") === sizeSelect.value
          ) || null;

          buyButton.disabled =
            !selectedVariant || Number(selectedVariant.stock) <= 0;
        });
      }

      buyButton.addEventListener("click", () => {
        if (sizeSelect && !sizeSelect.value) {
          alert("Seleccioná un talle antes de continuar.");
          return;
        }

        if (isSingleProduct && Number(selectedVariant.stock) <= 0) {
          return;
        }

        alert("¡Próximamente vas a poder comprar directamente desde acá!");
      });

      options.appendChild(buyButton);

      /* VOLVER */

      const back = document.createElement("a");
      back.href = "./";
      back.className = "back-link";
      back.textContent = "← volver a la tienda";

      details.append(heading, description, options, back);
      page.append(gallery, details);
    }

    async function loadProduct() {
      if (!slug) {
        page.textContent = "no se indicó ningún producto.";
        return;
      }

      try {
        const response = await fetch(`${API_URL}/products`);

        if (!response.ok) {
          throw new Error("No se pudieron cargar los productos");
        }

        const data = await response.json();
        const products = data.products || [];

        const product = products.find(item => item.slug === slug);

        if (!product) {
          page.textContent = "no encontramos este producto.";
          return;
        }

        renderProduct(product);

      } catch (error) {
        console.error(error);
        page.textContent =
          "no pudimos cargar el producto. intentá nuevamente.";
      }
    }

    loadCategories();
    loadProduct();
  </script>

</body>
</html>
