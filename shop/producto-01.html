
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto — Morón Madrid</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <a href="../" class="logo">
      <img src="../sticker.png" alt="morón madrid">
    </a>

    <nav>
      <span class="tienda-link">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEguX14GzmThK94GeMibceKA7zICqad06YxNNfXdMDJWfekWmO24pdYg9z9BdkouOws5N-Haa-0IfN-U79hTyy7-EB1WS40G4UsRYDb8xFVnx9iB5SYvx0J5BH5a5E35dx3srcSqWHckxVBJ/s1600/nuevo-2.gif" alt="">
        <a href="./">tienda</a>
      </span>
      <a href="../#estudio">archivo</a>
      <a href="../#nosotros">nosotros</a>
      <a href="../#contacto">contacto</a>
    </nav>
  </header>

  <main class="product-page">

    <section class="product-gallery">
      <img src="images/producto-01.jpg" alt="Producto vista frontal">
      <img src="images/producto-01-back.jpg" alt="Producto vista trasera">
    </section>

    <section class="product-details">
      <div>
        <p class="product-category">morón madrid / colección</p>
        <h1>nombre del producto</h1>
        <p class="product-price">$ —</p>
      </div>

      <div class="product-description">
        <p>Descripción del producto. Materiales, detalles y características.</p>
      </div>

      <div class="product-options">
        <label for="size">talle</label>
        <select id="size">
          <option value="">seleccionar talle</option>
          <option>único</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
        </select>

        <button type="button">comprar</button>
      </div>

      <a href="./" class="back-link">← volver a la tienda</a>
    </section>

  </main>

</body>
</html>
