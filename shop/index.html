<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morón Madrid — Tienda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <span class="tienda-link">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEguX14GzmThK94GeMibceKA7zICqad06YxNNfXdMDJWfekWmO24pdYg9z9BdkouOws5N-Haa-0IfN-U79hTyy7-EB1WS40G4UsRYDb8xFVnx9iB5SYvx0J5BH5a5E35dx3srcSqWHckxVBJ/s1600/nuevo-2.gif" alt="">
        <a href="./">tienda</a>
      </span>
      <a href="../#estudio">archivo</a>
      <a href="../#nosotros">nosotros</a>
      <a href="../#contacto">contacto</a>
    </nav>
  </header>

  <a href="../" class="logo">
    <img src="../sticker.png" alt="morón madrid">
  </a>

  <div class="category-menu" id="category-menu" aria-label="Categorías">
    <button type="button" class="category-filter active" data-category="all">todos</button>
  </div>

  <main class="catalog" id="catalog">
    <p id="catalog-message">cargando productos...</p>
  </main>

  <script>
    const API_URL = "https://moron-madrid-api.moronmadrid.workers.dev";
    const catalog = document.getElementById("catalog");
    const categoryMenu = document.getElementById("category-menu");
    let allProducts = [];
    let selectedCategory = "all";

    function formatPrice(price) {
      return "$ " + Number(price).toLocaleString("es-AR");
    }

    function createProduct(product) {
      const article = document.createElement("article");
      article.className = "product";

      const link = document.createElement("a");
      link.className = "product-link";
      link.href = `producto-01.html?slug=${encodeURIComponent(product.slug)}`;

      const images = document.createElement("div");
      images.className = "product-images";

      const primary = document.createElement("img");
      primary.className = "primary-image";
      primary.src = product.image || "";
      primary.alt = product.name;
      primary.loading = "lazy";
      images.appendChild(primary);

      if (product.image_hover) {
        const secondary = document.createElement("img");
        secondary.className = "secondary-image";
        secondary.src = product.image_hover;
        secondary.alt = product.name + " — segunda vista";
        secondary.loading = "lazy";
        images.appendChild(secondary);
      }

      const info = document.createElement("div");
      info.className = "product-info";

      const name = document.createElement("span");
      name.textContent = product.name;

      const price = document.createElement("span");
      price.textContent = formatPrice(product.price);

      info.append(name, price);
      link.append(images, info);
      article.append(link);
      return article;
    }

    function renderProducts() {
      catalog.replaceChildren();

      const products = selectedCategory === "all"
        ? allProducts
        : allProducts.filter(product => product.category_id === selectedCategory);

      if (!products.length) {
        const empty = document.createElement("p");
        empty.className = "catalog-message";
        empty.textContent = allProducts.length
          ? "no hay productos en esta categoría"
          : "próximamente";
        catalog.append(empty);
        return;
      }

      products.forEach(product => catalog.appendChild(createProduct(product)));
    }

    function renderCategoryMenu(categories) {
      categoryMenu.replaceChildren();

      const allButton = document.createElement("button");
      allButton.type = "button";
      allButton.className = "category-filter active";
      allButton.dataset.category = "all";
      allButton.textContent = "todos";
      categoryMenu.append(allButton);

      categories.forEach(category => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "category-filter";
        button.dataset.category = category.id;
        button.textContent = category.name.toLowerCase();
        categoryMenu.append(button);
      });

      categoryMenu.addEventListener("click", event => {
        const button = event.target.closest(".category-filter");
        if (!button) return;

        selectedCategory = button.dataset.category;
        categoryMenu.querySelectorAll(".category-filter").forEach(item => {
          item.classList.toggle("active", item === button);
        });
        renderProducts();
      });
    }

    async function loadStore() {
      try {
        const [productsResponse, categoriesResponse] = await Promise.all([
          fetch(`${API_URL}/products`),
          fetch(`${API_URL}/categories`)
        ]);

        if (!productsResponse.ok) throw new Error("No se pudieron cargar los productos.");
        if (!categoriesResponse.ok) throw new Error("No se pudieron cargar las categorías.");

        const productsData = await productsResponse.json();
        const categoriesData = await categoriesResponse.json();

        allProducts = Array.isArray(productsData.products) ? productsData.products : [];
        renderCategoryMenu(Array.isArray(categoriesData.categories) ? categoriesData.categories : []);
        renderProducts();
      } catch (error) {
        console.error(error);
        catalog.textContent = "no pudimos cargar la tienda. intentá nuevamente.";
      }
    }

    loadStore();
  </script>
</body>
</html>
