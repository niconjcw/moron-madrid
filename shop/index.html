
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morón Madrid — Tienda</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <div class="announcement-bar" style="background-color: #dcd63b;">
    <marquee>3 cuotas sin interés / -5% por transferencia / envíos a todo el país /</marquee>
  </div>

  <header class="site-header">

    <div class="header-left">
      <a href="./">inicio</a>

      <div class="nav-group">
        <button class="nav-button" id="products-toggle" type="button" aria-expanded="false">
          productos <i class="fas fa-angle-down"></i>
        </button>

        <div class="header-dropdown" id="products-dropdown" hidden>
          <button type="button" class="category-filter active" data-category="all">ver todo</button>
          <div id="dynamic-categories"></div>
        </div>
      </div>
    </div>

    <a href="./" class="logo" aria-label="Morón Madrid">
      <img src="../sticker.png" alt="morón madrid">
    </a>

    <div class="header-right">
      <div class="nav-group">
        <button class="nav-button" id="info-toggle" type="button" aria-expanded="false">
          información <i class="fas fa-angle-down"></i>
        </button>

        <div class="header-dropdown" id="info-dropdown" hidden>
          <a href="nosotros.html">nosotros</a>
          <a href="compras-envios.html">compras / envíos</a>
          <a href="devoluciones.html">devoluciones</a>
        </div>
      </div>

      <a href="https://moronmadrid.com.ar/#contacto">contacto</a>

      <a href="#" class="cart-icon" title="Carrito">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 1.9-1.4L22 8H6"/>
          <circle cx="10" cy="20" r="1"/>
          <circle cx="18" cy="20" r="1"/>
        </svg>
      </a>
    </div>

    <div class="mobile-header">
      <button class="mobile-menu-button" id="mobile-menu-toggle" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>

      <a href="./" class="mobile-logo">
        <img src="../sticker.png" alt="morón madrid">
      </a>

      <a href="#" class="cart-icon mobile-cart" title="Carrito">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 1.9-1.4L22 8H6"/>
          <circle cx="10" cy="20" r="1"/>
          <circle cx="18" cy="20" r="1"/>
        </svg>
      </a>
    </div>

  </header>

  <nav class="mobile-panel" id="mobile-panel" hidden>
    <button class="mobile-close" id="mobile-close" aria-label="Cerrar menú">×</button>

    <a href="./">inicio</a>

    <button class="mobile-section-button" id="mobile-products-toggle" aria-expanded="false">
      productos <i class="fas fa-angle-down"></i>
    </button>

    <div class="mobile-submenu" id="mobile-categories">
      <button type="button" class="mobile-category active" data-category="all">ver todo</button>
    </div>

    <button class="mobile-section-button" id="mobile-info-toggle" aria-expanded="false">
      información <i class="fas fa-angle-down"></i>
    </button>

    <div class="mobile-submenu" id="mobile-info-links">
      <a href="nosotros.html">nosotros</a>
      <a href="compras-envios.html">compras / envíos</a>
      <a href="devoluciones.html">devoluciones</a>
    </div>

    <a href="https://moronmadrid.com.ar/#contacto">contacto</a>
  </nav>

  <main class="catalog" id="catalog">
    <p class="catalog-message">cargando productos...</p>
  </main>

<script>
const API_URL = "https://moron-madrid-api.moronmadrid.workers.dev";

const catalog = document.getElementById("catalog");
const productsDropdown = document.getElementById("products-dropdown");
const dynamicCategories = document.getElementById("dynamic-categories");
const mobileCategories = document.getElementById("mobile-categories");

let allProducts = [];
let selectedCategory = "all";

function formatPrice(price) {
  return "$ " + Number(price).toLocaleString("es-AR");
}

/* MENÚ MOBILE */

const mobilePanel = document.getElementById("mobile-panel");

function openMobileMenu() {
  mobilePanel.hidden = false;
  requestAnimationFrame(() => mobilePanel.classList.add("is-open"));
  document.body.style.overflow = "hidden";
}

function closeMobileMenu() {
  mobilePanel.classList.remove("is-open");
  document.body.style.overflow = "";

  setTimeout(() => {
    if (!mobilePanel.classList.contains("is-open")) {
      mobilePanel.hidden = true;
    }
  }, 350);
}

document.getElementById("mobile-menu-toggle")
  .addEventListener("click", openMobileMenu);

document.getElementById("mobile-close")
  .addEventListener("click", closeMobileMenu);

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeMobileMenu();
    productsDropdown.hidden = true;
    infoDropdown.hidden = true;
  }
});

function toggleMobileSection(buttonId, submenuId) {
  const button = document.getElementById(buttonId);
  const submenu = document.getElementById(submenuId);

  button.addEventListener("click", () => {
    const opening = !submenu.classList.contains("is-open");
    submenu.classList.toggle("is-open", opening);
    button.setAttribute("aria-expanded", String(opening));
  });
}

toggleMobileSection("mobile-products-toggle", "mobile-categories");
toggleMobileSection("mobile-info-toggle", "mobile-info-links");

/* PRODUCTOS */

function createProduct(product) {
  const article = document.createElement("article");
  article.className = "product";

  const link = document.createElement("a");
  link.className = "product-link";
  link.href = `producto-01.html?slug=${encodeURIComponent(product.slug)}`;

  const images = document.createElement("div");
  images.className = "product-images";

  const primary = document.createElement("img");
  primary.className = "primary-image";
  primary.src = product.image || "";
  primary.alt = product.name;
  primary.loading = "lazy";
  images.appendChild(primary);

  if (product.image_hover) {
    const secondary = document.createElement("img");
    secondary.className = "secondary-image";
    secondary.src = product.image_hover;
    secondary.alt = product.name + " — segunda vista";
    secondary.loading = "lazy";
    images.appendChild(secondary);
  }

  const info = document.createElement("div");
  info.className = "product-info";

  const name = document.createElement("span");
  name.textContent = product.name;

  const price = document.createElement("span");
  price.textContent = formatPrice(product.price);

  info.append(name, price);
  link.append(images, info);
  article.append(link);

  return article;
}

function renderProducts() {
  catalog.replaceChildren();

  const products = selectedCategory === "all"
    ? allProducts
    : allProducts.filter(product =>
        String(product.category_id) === String(selectedCategory)
      );

  if (!products.length) {
    const empty = document.createElement("p");
    empty.className = "catalog-message";
    empty.textContent = allProducts.length
      ? "no hay productos en esta categoría"
      : "próximamente";
    catalog.append(empty);
    return;
  }

  products.forEach(product => {
    catalog.appendChild(createProduct(product));
  });
}

/* SELECCIONAR CATEGORÍA */

function updateCategoryButtons() {
  document.querySelectorAll("[data-category]").forEach(button => {
    button.classList.toggle(
      "active",
      String(button.dataset.category) === String(selectedCategory)
    );
  });
}

function selectCategory(categoryId) {
  selectedCategory = categoryId;

  updateCategoryButtons();
  renderProducts();
  closeMobileMenu();

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* BOTÓN VER TODO DESKTOP */

const desktopAllButton = document.querySelector(
  '#products-dropdown [data-category="all"]'
);

desktopAllButton.addEventListener("click", () => {
  selectCategory("all");
});

/* CATEGORÍAS */

function renderCategoryMenu(categories) {
  dynamicCategories.replaceChildren();
  mobileCategories.replaceChildren();

  const allButton = document.createElement("button");
  allButton.type = "button";
  allButton.className = "mobile-category";
  allButton.dataset.category = "all";
  allButton.textContent = "ver todo";
  allButton.addEventListener("click", () => selectCategory("all"));

  mobileCategories.appendChild(allButton);

  categories.forEach(category => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "category-filter";
    button.dataset.category = category.id;
    button.textContent = category.name.toLowerCase();

    button.addEventListener("click", () => {
      selectCategory(category.id);
    });

    dynamicCategories.appendChild(button);

    const mobileButton = document.createElement("button");
    mobileButton.type = "button";
    mobileButton.className = "mobile-category";
    mobileButton.dataset.category = category.id;
    mobileButton.textContent = category.name.toLowerCase();

    mobileButton.addEventListener("click", () => {
      selectCategory(category.id);
    });

    mobileCategories.appendChild(mobileButton);
  });

  updateCategoryButtons();
}

/* DESPLEGABLES DESKTOP */

const productsToggle = document.getElementById("products-toggle");
const infoToggle = document.getElementById("info-toggle");
const infoDropdown = document.getElementById("info-dropdown");

productsToggle.addEventListener("click", () => {
  const opening = productsDropdown.hidden;

  productsDropdown.hidden = !opening;
  infoDropdown.hidden = true;

  productsToggle.setAttribute("aria-expanded", String(opening));
  infoToggle.setAttribute("aria-expanded", "false");
});

infoToggle.addEventListener("click", () => {
  const opening = infoDropdown.hidden;

  infoDropdown.hidden = !opening;
  productsDropdown.hidden = true;

  infoToggle.setAttribute("aria-expanded", String(opening));
  productsToggle.setAttribute("aria-expanded", "false");
});

document.addEventListener("click", event => {
  if (!event.target.closest(".nav-group")) {
    productsDropdown.hidden = true;
    infoDropdown.hidden = true;

    productsToggle.setAttribute("aria-expanded", "false");
    infoToggle.setAttribute("aria-expanded", "false");
  }
});

/* CARGA DE LA TIENDA */

async function loadStore() {
  try {
    const [productsResponse, categoriesResponse] = await Promise.all([
      fetch(`${API_URL}/products`),
      fetch(`${API_URL}/categories`)
    ]);

    if (!productsResponse.ok || !categoriesResponse.ok) {
      throw new Error("No se pudo cargar la tienda.");
    }

    const productsData = await productsResponse.json();
    const categoriesData = await categoriesResponse.json();

    allProducts = Array.isArray(productsData.products)
      ? productsData.products
      : [];

    const categories = Array.isArray(categoriesData.categories)
      ? categoriesData.categories
      : [];

    renderCategoryMenu(categories);
    renderProducts();

  } catch (error) {
    console.error(error);
    catalog.textContent = "no pudimos cargar la tienda. intentá nuevamente.";
  }
}

loadStore();
</script>

</body>
</html>
