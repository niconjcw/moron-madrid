<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morón Madrid — Tienda</title>
  <link rel="icon" type="image/png" href="/home/images/sticker.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <!-- HEADER COMPARTIDO -->
  <div id="site-header"></div>

  <main class="catalog" id="catalog">
    <p class="catalog-message">cargando productos...</p>
  </main>

  <!-- FOOTER -->


  <!-- FOOTER COMPARTIDO -->
  <div id="shared-footer"></div>

  <!-- SCRIPTS COMPARTIDOS -->
  <script src="./header.js"></script>
  <script src="./footer.js"></script>
  <script src="./modals.js"></script>

<script>

 document.addEventListener("DOMContentLoaded", () => {

const API_URL = "https://moron-madrid-api.moronmadrid.workers.dev";

const catalog = document.getElementById("catalog");
const productsDropdown = document.getElementById("products-dropdown");
const dynamicCategories = document.getElementById("dynamic-categories");
const mobileCategories = document.getElementById("mobile-categories");

let allProducts = [];
const urlParams = new URLSearchParams(window.location.search);
let selectedCategory = urlParams.get("category") || "all";

function formatPrice(price) {
  return "$ " + Number(price).toLocaleString("es-AR");
}

/* MENÚ Y DESPLEGABLES: gestionados por header.js */
const closeMobileMenu = () => window.closeMobileMenu?.();

/* IMÁGENES DEL PRODUCTO */

function getProductImages(product) {
  const images = [
    product.image,
    product.image_hover,
    ...(Array.isArray(product.gallery)
      ? product.gallery.map(item => {
          if (typeof item === "string") return item;
          return item.image_url || item.url || item.image || "";
        })
      : [])
  ];

  return [...new Set(images.filter(Boolean))];
}

/* CONTROL DE STOCK */

function isProductOutOfStock(product) {
  if (Array.isArray(product.variants) && product.variants.length > 0) {
    return product.variants.every(variant =>
      Number(variant.stock) <= 0
    );
  }

  return Number(product.stock) <= 0;
}

/* CREAR PRODUCTO */

function createProduct(product) {
  const article = document.createElement("article");
  article.className = "product";

  const outOfStock = isProductOutOfStock(product);

  if (outOfStock) {
    article.classList.add("out-of-stock");
  }

  const images = document.createElement("div");
  images.className = "product-images";

  images.style.touchAction = "pan-y";

  const imageUrls = getProductImages(product);
  let currentImage = 0;

  const imageElements = imageUrls.map((url, index) => {
    const img = document.createElement("img");
    img.src = url;
    img.alt = product.name + " — foto " + (index + 1);
    img.loading = "lazy";
    img.className = index === 0 ? "product-slide active" : "product-slide";
    images.appendChild(img);
    return img;
  });

  const imageLink = document.createElement("a");
  imageLink.className = "product-image-link";
  imageLink.href = `producto-01.html?slug=${encodeURIComponent(product.slug)}`;
  imageLink.setAttribute("aria-label", "Ver " + product.name);
  images.appendChild(imageLink);

  /* ETIQUETA SIN STOCK */

  if (outOfStock) {
    const stockLabel = document.createElement("div");
    stockLabel.className = "out-of-stock-label";
    stockLabel.textContent = "SIN STOCK";
    stockLabel.setAttribute("aria-label", "Producto sin stock");
    images.appendChild(stockLabel);
  }

  if (imageElements.length > 1) {
    const controls = document.createElement("div");
    controls.className = "product-carousel-controls";

    const previous = document.createElement("button");
    previous.type = "button";
    previous.className = "product-carousel-arrow previous";
    previous.innerHTML = '<i class="fas fa-angle-left"></i>';
    previous.setAttribute("aria-label", "Foto anterior");

    const next = document.createElement("button");
    next.type = "button";
    next.className = "product-carousel-arrow next";
    next.innerHTML = '<i class="fas fa-angle-right"></i>';
    next.setAttribute("aria-label", "Foto siguiente");

    function showImage(index) {
      currentImage = (index + imageElements.length) % imageElements.length;

      imageElements.forEach((img, i) => {
        img.classList.toggle("active", i === currentImage);
      });
    }

    previous.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      showImage(currentImage - 1);
    });

    next.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      showImage(currentImage + 1);
    });

    /* SWIPE / DESLIZAMIENTO */

    let startX = 0;
    let startY = 0;
    let pointerStart = false;
    let suppressClick = false;

    images.addEventListener("pointerdown", event => {
      if (event.target.closest("button")) return;

      startX = event.clientX;
      startY = event.clientY;
      pointerStart = true;
    });

    images.addEventListener("pointerup", event => {
      if (!pointerStart) return;

      pointerStart = false;

      const differenceX = event.clientX - startX;
      const differenceY = event.clientY - startY;

      if (
        Math.abs(differenceX) > 35 &&
        Math.abs(differenceX) > Math.abs(differenceY) * 1.2
      ) {
        event.preventDefault();

        showImage(
          differenceX < 0
            ? currentImage + 1
            : currentImage - 1
        );

        suppressClick = true;

        setTimeout(() => {
          suppressClick = false;
        }, 400);
      }
    });

    images.addEventListener("pointercancel", () => {
      pointerStart = false;
    });

    images.addEventListener("click", event => {
      if (suppressClick) {
        event.preventDefault();
        event.stopPropagation();
        suppressClick = false;
      }
    }, true);

    controls.append(previous, next);
    images.appendChild(controls);
  }

  const info = document.createElement("a");
  info.className = "product-info";
  info.href = `producto-01.html?slug=${encodeURIComponent(product.slug)}`;

  const name = document.createElement("span");
  name.textContent = product.name;

  const price = document.createElement("span");
  price.textContent = formatPrice(product.price);

  info.append(name, price);
  article.append(images, info);

  return article;
}

/* RENDERIZAR PRODUCTOS */

function renderProducts() {
  catalog.replaceChildren();

  const products = selectedCategory === "all"
    ? allProducts
    : allProducts.filter(product =>
        String(product.category_id) === String(selectedCategory)
      );

  if (!products.length) {
    const empty = document.createElement("p");
    empty.className = "catalog-message";
    empty.textContent = allProducts.length
      ? "no hay productos en esta categoría"
      : "próximamente";
    catalog.append(empty);
    return;
  }

  products.forEach(product => {
    catalog.appendChild(createProduct(product));
  });
}

/* SELECCIONAR CATEGORÍA */

function updateCategoryButtons() {
  document.querySelectorAll("[data-category]").forEach(button => {
    button.classList.toggle(
      "active",
      String(button.dataset.category) === String(selectedCategory)
    );
  });
}

function selectCategory(categoryId) {
  selectedCategory = categoryId;
  updateCategoryButtons();
  renderProducts();
  closeMobileMenu();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* BOTÓN VER TODO DESKTOP */

const desktopAllButton = document.querySelector(
  '#products-dropdown [data-category="all"]'
);

desktopAllButton.addEventListener("click", () => {
  selectCategory("all");
});

/* CATEGORÍAS */

function renderCategoryMenu(categories) {
  dynamicCategories.replaceChildren();
  mobileCategories.replaceChildren();

  const allButton = document.createElement("button");
  allButton.type = "button";
  allButton.className = "mobile-category";
  allButton.dataset.category = "all";
  allButton.textContent = "ver todo";
  allButton.addEventListener("click", () => selectCategory("all"));
  mobileCategories.appendChild(allButton);

  categories.forEach(category => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "category-filter";
    button.dataset.category = category.id;
    button.textContent = category.name.toLowerCase();
    button.addEventListener("click", () => selectCategory(category.id));
    dynamicCategories.appendChild(button);

    const mobileButton = document.createElement("button");
    mobileButton.type = "button";
    mobileButton.className = "mobile-category";
    mobileButton.dataset.category = category.id;
    mobileButton.textContent = category.name.toLowerCase();
    mobileButton.addEventListener("click", () => selectCategory(category.id));
    mobileCategories.appendChild(mobileButton);
  });

  updateCategoryButtons();
}

/* CARGA DE LA TIENDA */

async function loadStore() {
  try {
    const [productsResponse, categoriesResponse] = await Promise.all([
      fetch(`${API_URL}/products`),
      fetch(`${API_URL}/categories`)
    ]);

    if (!productsResponse.ok || !categoriesResponse.ok) {
      throw new Error("No se pudo cargar la tienda.");
    }

    const productsData = await productsResponse.json();
    const categoriesData = await categoriesResponse.json();

    allProducts = Array.isArray(productsData.products)
      ? productsData.products
      : [];

    const categories = Array.isArray(categoriesData.categories)
      ? categoriesData.categories
      : [];

    renderCategoryMenu(categories);

    if (
      selectedCategory !== "all" &&
      !categories.some(category =>
        String(category.id) === String(selectedCategory)
      )
    ) {
      selectedCategory = "all";
    }

    updateCategoryButtons();
    renderProducts();

  } catch (error) {
    console.error(error);
    catalog.textContent = "no pudimos cargar la tienda. intentá nuevamente.";
  }
}

loadStore();

 });
</script>



<style>
  @font-face {
    font-display: block;
    font-family: Roboto;
    src: url(https://assets.brevo.com/font/Roboto/Latin/normal/normal/7529907e9eaf8ebb5220c5f9850e3811.woff2) format("woff2");
  }

  /* PRODUCTOS SIN STOCK */

  .product.out-of-stock .product-slide {
    filter: blur(3px);
    opacity: 0.65;
  }

  .out-of-stock-label {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 5;
    transform: translate(-50%, -50%) rotate(-35deg);
    font-family: inherit;
    font-size: 0.6rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    line-height: 1;
    color: #fff;
    white-space: nowrap;
    pointer-events: none;
  }

</style>

<script src="./cart.js"></script>

</body>
</html>
