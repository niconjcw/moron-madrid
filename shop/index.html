
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morón Madrid — Tienda</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <a href="../" class="logo">
      <img src="../sticker.png" alt="morón madrid">
    </a>

    <nav>
      <span class="tienda-link">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEguX14GzmThK94GeMibceKA7zICqad06YxNNfXdMDJWfekWmO24pdYg9z9BdkouOws5N-Haa-0IfN-U79hTyy7-EB1WS40G4UsRYDb8xFVnx9iB5SYvx0J5BH5a5E35dx3srcSqWHckxVBJ/s1600/nuevo-2.gif" alt="">
        <a href="./">tienda</a>
      </span>
      <a href="../#estudio">archivo</a>
      <a href="../#nosotros">nosotros</a>
      <a href="../#contacto">contacto</a>
    </nav>
  </header>

  <main class="catalog" id="catalog">
    <p id="catalog-message">cargando productos...</p>
  </main>

  <script>
    const API_URL = "https://moron-madrid-api.moronmadrid.workers.dev";

    const catalog = document.getElementById("catalog");
    const message = document.getElementById("catalog-message");

    function formatPrice(price) {
      return "$ " + Number(price).toLocaleString("es-AR");
    }

    function createProduct(product) {
      const article = document.createElement("article");
      article.className = "product";

      const link = document.createElement("a");
      link.className = "product-link";
      link.href = `producto-01.html?slug=${encodeURIComponent(product.slug)}`;

      const images = document.createElement("div");
      images.className = "product-images";

      const primary = document.createElement("img");
      primary.className = "primary-image";
      primary.src = product.image || "";
      primary.alt = product.name;
      primary.loading = "lazy";

      images.appendChild(primary);

      if (product.image_hover) {
        const secondary = document.createElement("img");
        secondary.className = "secondary-image";
        secondary.src = product.image_hover;
        secondary.alt = product.name + " — segunda vista";
        secondary.loading = "lazy";
        images.appendChild(secondary);
      }

      const info = document.createElement("div");
      info.className = "product-info";

      const name = document.createElement("span");
      name.textContent = product.name;

      const price = document.createElement("span");
      price.textContent = formatPrice(product.price);

      info.appendChild(name);
      info.appendChild(price);

      link.appendChild(images);
      link.appendChild(info);
      article.appendChild(link);

      return article;
    }

    async function loadProducts() {
      try {
        const response = await fetch(`${API_URL}/products`);

        if (!response.ok) {
          throw new Error("Error al consultar los productos");
        }

        const products = await response.json();

        catalog.innerHTML = "";

        if (!Array.isArray(products) || products.length === 0) {
          catalog.textContent = "próximamente";
          return;
        }

        products.forEach(product => {
          catalog.appendChild(createProduct(product));
        });

      } catch (error) {
        console.error(error);
        catalog.textContent = "no pudimos cargar los productos. intentá nuevamente.";
      }
    }

    loadProducts();
  </script>

</body>
</html>
