
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morón Madrid — Admin</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px;
      background: #f5f5f5;
      color: #000;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 80px;
    }

    header img { width: 65px; }

    main {
      max-width: 850px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      font-weight: 400;
      margin-bottom: 35px;
    }

    h2 {
      font-size: 16px;
      font-weight: 400;
      margin: 45px 0 20px;
    }

    input, button {
      padding: 13px;
      font: inherit;
      border: 1px solid #000;
      background: transparent;
    }

    input { width: 100%; }

    button {
      cursor: pointer;
      background: #000;
      color: #fff;
    }

    button:hover { opacity: .7; }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 18px 0;
      border-bottom: 1px solid #ccc;
    }

    .product-name { font-weight: 500; }
    .product-info { color: #666; margin-top: 6px; }

    #message {
      margin-top: 20px;
      line-height: 1.5;
    }

    #logout { margin-top: 35px; }

    [hidden] { display: none !important; }

    @media (max-width: 550px) {
      body { padding: 20px; }
      header { margin-bottom: 60px; }
      .product { align-items: flex-start; }
    }
  </style>
</head>

<body>
  <header>
    <a href="./">
      <img src="../sticker.png" alt="Morón Madrid">
    </a>
    <span>ADMIN / 01</span>
  </header>

  <main>
    <section id="login">
      <h1>Acceso privado</h1>
      <form id="login-form">
        <input
          id="password"
          type="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          required
        >
        <button type="submit">Entrar</button>
      </form>
    </section>

    <section id="dashboard" hidden>
      <h1>Morón Madrid — Administración</h1>

      <h2>Productos</h2>
      <button id="refresh">Actualizar lista</button>

      <div id="products"></div>

      <button id="logout">Cerrar sesión</button>
    </section>

    <p id="message" role="status"></p>
  </main>

  <script>
    const API = "https://moron-madrid-api.moronmadrid.workers.dev";
    const loginSection = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");
    const productsBox = document.getElementById("products");

    function showLogin() {
      loginSection.hidden = false;
      dashboard.hidden = true;
      sessionStorage.removeItem("mm_admin_token");
    }

    async function loadProducts() {
      message.textContent = "Cargando productos...";
      productsBox.replaceChildren();

      try {
        const response = await fetch(API + "/products");
        if (!response.ok) throw new Error();

        const data = await response.json();

        if (!data.products || data.products.length === 0) {
          message.textContent = "Todavía no hay productos.";
          return;
        }

        data.products.forEach(product => {
          const item = document.createElement("div");
          item.className = "product";

          const info = document.createElement("div");
          const name = document.createElement("div");
          const details = document.createElement("div");

          name.className = "product-name";
          name.textContent = product.name;

          details.className = "product-info";
          details.textContent =
            product.slug + " · $" +
            Number(product.price).toLocaleString("es-AR");

          info.append(name, details);
          item.append(info);
          productsBox.append(item);
        });

        message.textContent = data.products.length +
          (data.products.length === 1 ? " producto encontrado." : " productos encontrados.");

      } catch {
        message.textContent = "No pudimos cargar los productos.";
      }
    }

    async function showDashboard() {
      loginSection.hidden = true;
      dashboard.hidden = false;
      await loadProducts();
    }

    async function checkSession() {
      const token = sessionStorage.getItem("mm_admin_token");
      if (!token) return;

      try {
        const response = await fetch(API + "/admin/me", {
          headers: { Authorization: "Bearer " + token }
        });

        if (response.ok) {
          await showDashboard();
        } else {
          showLogin();
        }
      } catch {
        message.textContent = "No se pudo conectar con el servidor.";
      }
    }

    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Verificando...";

      try {
        const response = await fetch(API + "/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          message.textContent = data.error || "No se pudo iniciar sesión.";
          return;
        }

        sessionStorage.setItem("mm_admin_token", data.token);
        document.getElementById("password").value = "";
        await showDashboard();

      } catch {
        message.textContent = "Error de conexión. Intentá nuevamente.";
      }
    });

    document.getElementById("refresh").addEventListener("click", loadProducts);

    document.getElementById("logout").addEventListener("click", async () => {
      const token = sessionStorage.getItem("mm_admin_token");

      try {
        await fetch(API + "/admin/logout", {
          method: "POST",
          headers: { Authorization: "Bearer " + token }
        });
      } finally {
        showLogin();
        message.textContent = "Sesión cerrada.";
      }
    });

    checkSession();
  </script>
</body>
</html>

    checkSession();
  </script>
</body>
</html>
